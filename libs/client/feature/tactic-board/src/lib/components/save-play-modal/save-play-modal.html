<ion-header class="ion-no-border">
  <ion-toolbar>
    <div class="header-modal-row">
      <div class="modal-title-group">
        <div class="modal-badge-icon">
          <ion-icon name="save-outline"></ion-icon>
        </div>
        <div>
          <h2 class="modal-heading">
            {{ existingPlay ? 'Update Play / Formation' : 'Save to Playbook' }}
          </h2>
          <p class="modal-subheading">Configure name, category, and tactical coaching keys</p>
        </div>
      </div>
      <button
        type="button"
        class="modal-close-icon-btn"
        (click)="cancel()"
      >
        <ion-icon name="close-outline"></ion-icon>
      </button>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="modal-form-body">
    <!-- Sport Tag indicator -->
    <div class="sport-tag-row">
      <span class="sport-label">Sport Tag:</span>
      <span
        class="sport-pill"
        [class.pill-soccer]="sport === 'soccer'"
        [class.pill-volleyball]="sport === 'volleyball'"
      >
        {{ sport === 'soccer' ? '⚽ Soccer' : '🏐 Volleyball' }}
      </span>
    </div>

    <!-- Title -->
    <div class="form-item">
      <label class="item-label">
        Play / Formation Name <span class="required">*</span>
      </label>
      <input
        type="text"
        class="item-input input-bold"
        [(ngModel)]="title"
        placeholder="e.g. 4-3-3 High Press, Short Corner Inswing, 5-1 Rot 1"
        required
      />
    </div>

    <!-- Category -->
    <div class="form-item">
      <label class="item-label">
        Category
      </label>
      <select
        class="item-input"
        [(ngModel)]="category"
      >
        <option value="formation">Formation / System</option>
        <option value="set_piece">Set Piece Routine</option>
        <option value="offensive">Offensive Scheme</option>
        <option value="defensive">Defensive Scheme</option>
        <option value="transition">Transition / Counter</option>
        <option value="drill_setup">Practice Drill Setup</option>
        <option value="other">Other</option>
      </select>
    </div>

    <!-- Description -->
    <div class="form-item">
      <label class="item-label">
        Brief Description / Objective
      </label>
      <textarea
        rows="2"
        class="item-input textarea-input"
        [(ngModel)]="description"
        placeholder="Summarize the core movement or setup..."
      ></textarea>
    </div>

    <!-- Tags -->
    <div class="form-item">
      <label class="item-label">
        Tags (comma-separated)
      </label>
      <input
        type="text"
        class="item-input"
        [(ngModel)]="tagsInput"
        placeholder="e.g. Corner, Near Post, Pressing, Rotation 1"
      />
    </div>

    <!-- Coaching Notes / Keys -->
    <div class="form-item">
      <label class="item-label">
        Tactical Coaching Keys & Notes
      </label>
      <textarea
        rows="3"
        class="item-input textarea-input"
        [(ngModel)]="notes"
        placeholder="Key coaching cues for players (e.g. 'Striker makes decoy run towards near post', 'Setter penetrates immediately on contact')..."
      ></textarea>
    </div>

    <!-- Action Buttons -->
    <div class="modal-footer-row">
      <button
        type="button"
        class="btn-modal btn-cancel"
        (click)="cancel()"
      >
        Cancel
      </button>

      <button
        type="button"
        class="btn-modal btn-save"
        [disabled]="!title.trim()"
        (click)="save()"
      >
        <ion-icon name="save-outline"></ion-icon>
        <span>{{ existingPlay ? 'Update Play' : 'Save Play' }}</span>
      </button>
    </div>
  </div>
</ion-content>
